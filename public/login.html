<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — BudgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="homepage.css" />
</head>
<body>

  <!-- ===== HEADER (logo + back link) ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="HomePage.html" class="logo">
        <img src="/Logo.jpeg" alt="" class="logo-img" />
        BudgetWise
      </a>
      <a href="HomePage.html" class="nav-login">&larr; Back to home</a>
    </div>
  </header>

  <!-- ===== LOGIN CARD ===== -->
  <main class="auth-page">
    <div class="auth-card">
      <span class="logo">
        <img src="/Logo.jpeg" alt="" class="logo-img" />
        BudgetWise
      </span>

      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to see your balance.</p>

      <form id="login-form" novalidate>
        <label for="login-email">Email or username</label>
        <input type="text" id="login-email" name="email" autocomplete="username" required />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required />

        <p id="login-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-lg">Log in</button>
      </form>

      <p class="auth-switch">No account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
