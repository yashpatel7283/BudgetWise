<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — BudgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="homepage.css" />
</head>
<body>

  <!-- ===== HEADER (logo + back link) ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="HomePage.html" class="logo">
        <img src="/Logo.jpeg" alt="" class="logo-img" />
        BudgetWise
      </a>
      <a href="HomePage.html" class="nav-login">&larr; Back to home</a>
    </div>
  </header>

  <!-- ===== SIGNUP CARD ===== -->
  <main class="auth-page">
    <div class="auth-card">
      <span class="logo">
        <img src="/Logo.jpeg" alt="" class="logo-img" />
        BudgetWise
      </span>

      <h1>Create your account</h1>
      <p class="auth-sub">Takes less than a minute.</p>

      <form id="signup-form" novalidate>
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" name="username" autocomplete="username" required />

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="email" autocomplete="email" required />

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" autocomplete="new-password" required />

        <label for="signup-confirm">Confirm password</label>
        <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" required />

        <p id="signup-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-lg">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
